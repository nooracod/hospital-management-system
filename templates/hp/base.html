<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}سامانه جامع بیمارستانی نورا{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --pastel-blue: #a0c4ff;
            --pastel-green: #caffbf;
            --pastel-pink: #ffadad;
            --pastel-purple: #bdb2ff;
            --pastel-yellow: #fdffb6;
            --pastel-bg: #f8f9fa;
            --dark-text: #2b2d42;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--pastel-bg);
            color: var(--dark-text);
        }

        .navbar-pastel {
            background-color: #ffffff;
            box-shadow: 0 4px 15px rgba(189, 178, 255, 0.2);
        }

        .btn-pastel-primary {
            background-color: var(--pastel-purple);
            color: #4a3e80;
            border: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-pastel-primary:hover {
            background-color: #a797ff;
            color: #fff;
            transform: translateY(-2px);
        }

        .btn-pastel-success {
            background-color: var(--pastel-green);
            color: #2b5e28;
            border: none;
            font-weight: bold;
        }

        .card-pastel {
            border: none;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            background: #ffffff;
            transition: transform 0.3s;
        }

        .card-pastel:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-pastel py-3 mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold fs-4 text-purple" style="color: #6c5ce7;" href="{% url 'home' %}">
            <i class="bi bi-hospital me-2"></i> بیمارستان تخصصی نورا
        </a>
        <div class="d-flex align-items-center gap-2">
            {% if user.is_authenticated %}
                <a href="{% url 'dashboard' %}" class="btn btn-pastel-primary rounded-pill px-4">داشبورد کاربری</a>
                <a href="{% url 'logout' %}" class="btn btn-outline-danger rounded-pill px-3">خروج</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-pastel-primary rounded-pill px-4">ورود</a>
                <a href="{% url 'register' %}" class="btn btn-pastel-success rounded-pill px-4">ثبت‌نام کاربر جدید</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mb-5">
    {% block content %}{% endblock %}
</div>

<footer class="text-center py-4 text-muted border-top mt-5 bg-white">
    <p class="mb-0">تمامی حقوق برای سامانه بیمارستان نورا محفوظ است © ۲۰۲۶</p>
</footer>

</body>
</html>
